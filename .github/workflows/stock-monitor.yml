name: Japan Stock Monitor

on:
  workflow_dispatch:

  schedule:
    # 日本時間 16:00 = UTC 07:00
    # 月〜金に自動実行
    # 日本時間 08:30 に月〜金で自動実行
    - cron: "30 23 * * 0-4"
    - cron: "0 7 * * 1-5"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run stock monitor
        run: python monitor.py

      - name: Run backtest
        run: python backtest.py

      - name: Save reports and signal history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add report.md signals.csv backtest_report.md

          if git diff --cached --quiet; then
            echo "No changes to save"
          else
            git commit -m "Update stock analysis and backtest"
            git push
          fi
